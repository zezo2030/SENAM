# SENAM dashboard — nginx: serve the SPA and reverse-proxy the backend.
# The api service is reachable as http://api:3000 on the compose network.

upstream senam_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't let nginx cap upload size below what the API allows.
    client_max_body_size 25m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API (NestJS global prefix is /v1; also covers /v1/uploads/raw/...) ──────
    location /v1/ {
        proxy_pass http://senam_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health & Swagger (Swagger is only enabled when NODE_ENV != production) ──
    location = /healthz {
        proxy_pass http://senam_api;
        proxy_set_header Host $host;
    }
    location /swagger {
        proxy_pass http://senam_api;
        proxy_set_header Host $host;
    }

    # ── WebSocket (socket.io) ──────────────────────────────────────────────────
    # The dashboard connects to the `/ws` namespace; socket.io's default
    # transport path is /socket.io/. Both locations are proxied so the WS works
    # whether the gateway uses the default path or a custom `/ws` path.
    location /socket.io/ {
        proxy_pass http://senam_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
    location /ws {
        proxy_pass http://senam_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── SPA: hashed assets are immutable; everything else falls back to index ──
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
