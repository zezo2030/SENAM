openapi: 3.1.0
info:
  title: SENAM API
  version: 0.1.0-mvp
  summary: SENAM backend API — MVP surface (Doha car-wash vertical, Arabic)
  description: |
    This document is the **planning sketch** of the SENAM public API. It enumerates
    the endpoint surface, the auth model, the error envelope, and the high-value
    request/response shapes. The **source of truth at runtime** is the OpenAPI
    document NestJS generates from `@nestjs/swagger` decorators (mounted at
    `/swagger` in non-production environments). A contract test in CI asserts that
    every path listed here exists in the generated document and vice versa
    (SC-006).

    Authentication: every protected endpoint requires a `Bearer` access token
    obtained via the email-OTP login flow. Refresh tokens are sent via the
    `/auth/refresh` endpoint.

    Errors: every non-2xx response follows RFC-7807 `application/problem+json`:
    `{ "type", "title", "status", "detail", "instance", "correlationId" }`.

servers:
  - url: https://api.senam.app/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: addresses
  - name: catalog
  - name: companies
  - name: slots
  - name: bookings
  - name: payments
  - name: coupons
  - name: reviews
  - name: notifications
  - name: provider
  - name: admin
  - name: settlements

paths:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/otp/request:
    post:
      tags: [auth]
      security: []
      summary: Request an OTP code by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                principal:
                  type: string
                  enum: [customer, provider, admin]
                  default: customer
      responses:
        "202":
          description: OTP enqueued for delivery (returns immediately).
        "429":
          description: Rate-limited per email or per IP.
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: Verify an OTP and exchange it for access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, principal]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
                principal: { type: string, enum: [customer, provider, admin] }
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Code is invalid, expired, or exceeded attempt limit.
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate the refresh token, issue a fresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token
      responses:
        "204": { description: Logged out. }

  # ─── Users (customer self) ─────────────────────────────────────────────────
  /me:
    get:
      tags: [users]
      summary: Get my profile
      responses: { "200": { description: ok } }
    patch:
      tags: [users]
      summary: Update my profile (name, phone, locale)
      responses: { "200": { description: ok } }
    delete:
      tags: [users]
      summary: Delete my account (anonymise PII, retain financial records)
      responses: { "204": { description: deleted } }
  /me/addresses:
    get: { tags: [addresses], summary: List my saved addresses, responses: { "200": { description: ok } } }
    post: { tags: [addresses], summary: Add an address, responses: { "201": { description: created } } }
  /me/addresses/{id}:
    patch: { tags: [addresses], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: ok } } }
    delete: { tags: [addresses], parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "204": { description: deleted } } }
  /me/favorites:
    get: { tags: [users], summary: List favourite companies, responses: { "200": { description: ok } } }
    post: { tags: [users], summary: Add a favourite, responses: { "201": { description: created } } }

  # ─── Catalog ───────────────────────────────────────────────────────────────
  /categories:
    get:
      tags: [catalog]
      security: []
      summary: List active categories
      responses: { "200": { description: ok } }
  /services:
    get:
      tags: [catalog]
      security: []
      summary: List services (optionally filtered by category)
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses: { "200": { description: ok } }
  /search:
    get:
      tags: [catalog]
      security: []
      summary: Cross-entity search (companies + services)
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }

  # ─── Companies ─────────────────────────────────────────────────────────────
  /companies:
    get:
      tags: [companies]
      summary: List active companies (sorted by distance / rating / price)
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [nearest, rating, price, best] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses: { "200": { description: ok } }
  /companies/{id}:
    get:
      tags: [companies]
      summary: Public company detail
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: ok } }
  /companies/{id}/services:
    get:
      tags: [companies]
      summary: Services this company offers, with price and duration
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: ok } }
  /companies/{id}/slots:
    get:
      tags: [slots]
      summary: Available time slots for a given date
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses: { "200": { description: ok } }

  # ─── Bookings ──────────────────────────────────────────────────────────────
  /bookings:
    post:
      tags: [bookings]
      summary: Create a booking (atomically reserves the slot, applies coupon, authorises payment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booking created; status=pending; dispatch attempt 1 has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409":
          description: Slot capacity exhausted, or coupon over-redeemed, between price quote and confirm.
        "422":
          description: Address outside service area, or company suspended, or invalid payload.
    get:
      tags: [bookings]
      summary: List my bookings (customer) — filter by status
      parameters: [{ name: status, in: query, schema: { type: string, enum: [current, completed, cancelled] } }]
      responses: { "200": { description: ok } }
  /bookings/{id}:
    get:
      tags: [bookings]
      summary: Booking detail (visible to customer, assigned provider, and admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: ok } }
  /bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel a booking (rules per PRD §9.3)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200": { description: Cancelled; fee and refund computed per policy. }
        "409": { description: Order is past the cancellable window. }
  /bookings/{id}/reorder:
    post:
      tags: [bookings]
      summary: Clone a previous booking into a new draft for the customer to confirm
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "201": { description: Draft booking created. } }
  /bookings/{id}/status:
    post:
      tags: [bookings, provider]
      summary: Advance the order status (provider/staff or admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [accepted, on_the_way, arrived, in_progress, completed, cancelled] }
                reason: { type: string }
      responses:
        "200": { description: Transition applied. }
        "409": { description: Illegal transition for the current status. }

  # ─── Payments (mostly internal; webhook is public) ─────────────────────────
  /payments/{id}:
    get:
      tags: [payments]
      summary: Payment detail (linked to a booking)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: ok } }
  /payments/webhook/myfatoorah:
    post:
      tags: [payments]
      security: []
      summary: Gateway webhook (HMAC-verified)
      responses: { "200": { description: Acknowledged. } }

  # ─── Coupons ───────────────────────────────────────────────────────────────
  /coupons/validate:
    post:
      tags: [coupons]
      summary: Validate a coupon for the current cart (no decrement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code: { type: string }
                subtotal: { type: integer, description: "minor units" }
                companyId: { type: string, format: uuid }
                categoryId: { type: string, format: uuid }
      responses:
        "200": { description: Valid; returns discounted total. }
        "404": { description: Unknown code. }
        "409": { description: Out of usage cap, expired, or scope mismatch. }

  # ─── Reviews ───────────────────────────────────────────────────────────────
  /bookings/{id}/review:
    post:
      tags: [reviews]
      summary: Submit a review for a completed booking
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratingCompany]
              properties:
                ratingCompany: { type: integer, minimum: 1, maximum: 5 }
                ratingStaff: { type: integer, minimum: 1, maximum: 5 }
                ratingSpeed: { type: integer, minimum: 1, maximum: 5 }
                ratingQuality: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
                photoObjectKeys: { type: array, items: { type: string } }
      responses: { "201": { description: Review created. } }
  /reviews/{id}/reply:
    post:
      tags: [reviews, provider]
      summary: One-time provider reply
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Reply created. }
        "409": { description: A reply already exists. }

  # ─── Notifications ────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: List my notifications
      responses: { "200": { description: ok } }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: marked read } }

  # ─── Provider self-service application (public, pre-approval) ─────────────
  /provider/applications:
    post:
      tags: [provider-applications]
      summary: Submit a new company application with KYC document references
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, displayName, slug, ownerEmail, ownerPassword, documents]
              properties:
                legalName: { type: string }
                displayName: { type: string }
                slug: { type: string }
                description: { type: string }
                phone: { type: string }
                ownerEmail: { type: string, format: email }
                ownerDisplayName: { type: string }
                ownerPassword: { type: string, minLength: 8 }
                documents:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [kind, objectKey]
                    properties:
                      kind:
                        type: string
                        enum: [commercial_registration, tax_card, owner_id, premises_photo, certification, insurance]
                      objectKey: { type: string }
      responses:
        "201": { description: Application submitted, pending admin review }
        "409": { description: slug or email already in use }
  /provider/applications/{id}:
    get:
      tags: [provider-applications]
      summary: Get the status of a submitted company application
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: ok }
        "404": { description: application_not_found }

  # ─── Provider dashboard ───────────────────────────────────────────────────
  /provider/me/company:
    get: { tags: [provider], responses: { "200": { description: My company } } }
    patch: { tags: [provider], summary: Update profile / hours / slot template, responses: { "200": { description: ok } } }
  /provider/me/staff:
    get: { tags: [provider], responses: { "200": { description: List staff } } }
    post: { tags: [provider], responses: { "201": { description: Create staff } } }
  /provider/me/services:
    get: { tags: [provider], responses: { "200": { description: ok } } }
    post: { tags: [provider], responses: { "201": { description: Add service offering } } }
  /provider/me/orders:
    get:
      tags: [provider]
      summary: Inbox of orders (filterable by status)
      parameters: [{ name: status, in: query, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /provider/me/orders/{id}/assign:
    post:
      tags: [provider]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [staffId], properties: { staffId: { type: string, format: uuid } } }
      responses: { "200": { description: ok } }
  /provider/me/financials:
    get:
      tags: [provider]
      summary: Earnings, commission, pending settlement
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { "200": { description: ok } }

  # ─── Admin ─────────────────────────────────────────────────────────────────
  /admin/companies:
    get: { tags: [admin], summary: List companies (filters, search), responses: { "200": { description: ok } } }
  /admin/companies/{id}/approve:
    post:
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: approved } }
  /admin/companies/{id}/suspend:
    post:
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: suspended } }
  /admin/companies/{id}/commission:
    patch:
      tags: [admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [commissionBps], properties: { commissionBps: { type: integer, minimum: 1000, maximum: 2500 } } }
      responses: { "200": { description: updated } }
  /admin/orders:
    get: { tags: [admin], summary: List all orders with filters, responses: { "200": { description: ok } } }
  /admin/orders/{id}/intervene:
    post:
      tags: [admin]
      summary: Force-cancel / refund / reassign (each requires a reason; emits an audit log)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [cancel, refund_full, refund_partial, reassign] }
                amount: { type: integer, description: "required for refund_partial; minor units" }
                reason: { type: string }
                newCompanyId: { type: string, format: uuid }
      responses: { "200": { description: ok } }
  /admin/coupons:
    get: { tags: [admin], responses: { "200": { description: ok } } }
    post: { tags: [admin], responses: { "201": { description: created } } }
  /admin/reports/sales:
    get:
      tags: [admin]
      summary: Aggregate sales report (date range up to 12 months)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses: { "200": { description: ok } }
  /admin/audit:
    get:
      tags: [admin]
      summary: Audit log search by target / actor / date
      responses: { "200": { description: ok } }

  # ─── Settlements ──────────────────────────────────────────────────────────
  /admin/settlements:
    get: { tags: [settlements, admin], responses: { "200": { description: ok } } }
  /admin/settlements/{id}/mark-paid:
    post:
      tags: [settlements, admin]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [payoutReference], properties: { payoutReference: { type: string } } }
      responses: { "200": { description: paid } }
  /provider/me/settlements:
    get: { tags: [provider, settlements], responses: { "200": { description: List my settlements } } }
  /provider/me/settlements/{id}/statement.pdf:
    get:
      tags: [provider, settlements]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Statement PDF } }

  # ─── Storage (uploads via presigned URLs) ─────────────────────────────────
  /uploads/presign:
    post:
      tags: [users]
      summary: Get a presigned PUT URL for an upload (gallery, KYC, review photo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType]
              properties:
                purpose: { type: string, enum: [gallery, kyc, review_photo, profile] }
                contentType: { type: string }
      responses: { "200": { description: Presigned URL + object key } }

  # ─── Health & versioning ──────────────────────────────────────────────────
  /healthz:
    get:
      tags: [users]
      security: []
      responses: { "200": { description: ok } }
  /readyz:
    get:
      tags: [users]
      security: []
      responses: { "200": { description: ready } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, description: seconds }
        refreshToken: { type: string }
        principal: { type: string, enum: [customer, provider, admin] }
        roles: { type: array, items: { type: string } }
    CreateBookingRequest:
      type: object
      required: [companyId, services, slotId, addressId, paymentMethod]
      properties:
        companyId: { type: string, format: uuid }
        services:
          type: array
          minItems: 1
          items:
            type: object
            required: [companyServiceId, quantity]
            properties:
              companyServiceId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        slotId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [card, applepay, googlepay, cod] }
        couponCode: { type: string }
        notes: { type: string }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, accepted, on_the_way, arrived, in_progress, completed, cancelled, unassignable]
        companyId: { type: string, format: uuid }
        slotStartAt: { type: string, format: date-time }
        total: { type: integer, description: minor units }
        commission: { type: integer, description: minor units }
        paymentId: { type: string, format: uuid }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
