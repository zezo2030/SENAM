# docker-compose.prod.yml — Reference production deployment
#
# Usage:
#   cp .env.example .env.prod   # fill in all real credentials
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# This compose file is a REFERENCE deployment suitable for a single-host
# production environment. For multi-node production, deploy Postgres and Redis
# separately (managed services or dedicated VMs) and set DATABASE_URL / REDIS_URL
# in the API service environment rather than using the embedded services here.

version: "3.9"

services:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    image: senam-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      OTP_RATE_LIMIT_ISSUE_PER_HOUR: ${OTP_RATE_LIMIT_ISSUE_PER_HOUR:-3}
      OTP_RATE_LIMIT_VERIFY_ATTEMPTS: ${OTP_RATE_LIMIT_VERIFY_ATTEMPTS:-5}
      DISPATCH_ATTEMPT_TIMEOUT_MS: ${DISPATCH_ATTEMPT_TIMEOUT_MS:-300000}
      DISPATCH_MAX_ATTEMPTS: ${DISPATCH_MAX_ATTEMPTS:-3}
      SETTLEMENT_CRON: ${SETTLEMENT_CRON:-0 30 0 * * 0}
      CARRY_FORWARD_ALERT_THRESHOLD: ${CARRY_FORWARD_ALERT_THRESHOLD:-10000}
      MYFATOORAH_API_KEY: ${MYFATOORAH_API_KEY}
      MYFATOORAH_SANDBOX: ${MYFATOORAH_SANDBOX:-false}
      MYFATOORAH_WEBHOOK_SECRET: ${MYFATOORAH_WEBHOOK_SECRET}
      AWS_SES_REGION: ${AWS_SES_REGION:-me-south-1}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - senam-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Postgres ───────────────────────────────────────────────────────────────
  # Remove this service and set DATABASE_URL when using a managed Postgres.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-senam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - senam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-senam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  # Remove this service and set REDIS_URL when using a managed Redis.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - senam-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  senam-net:
    driver: bridge
